name: Apply Character Creator Redesign
on:
  push:
    branches:
      - fix/character-creator-visual-redesign
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/character-creator-visual-redesign
      - name: Apply redesign
        run: python3 tools/character_creator_redesign_patch.py
      - name: Remove one-shot patch files
        run: rm tools/character_creator_redesign_patch.py .github/workflows/apply-character-redesign.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: redesign character creator illustrated portraits"
          git push origin HEAD:fix/character-creator-visual-redesign
