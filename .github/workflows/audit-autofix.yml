name: Audit systemic autofix

on:
  push:
    branches: [ "audit/game-defects-2-6" ]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[audit-autofix-2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/game-defects-2-6
      - name: Apply systemic audit fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Ignored opportunities must mutate the simulation, not only print flavour text.
          runtime = Path('app/src/main/java/com/metahumanlegacy/game/DeepLifeRuntime.kt')
          text = runtime.read_text()
          old = '''    private fun expireOpportunities(c: Campaign, state: DeepLifeState, echo: MutableList<String>): DeepLifeState {
        val expired = state.opportunities.filter { c.turn > it.expiresTurn }
        expired.filter { it.ignoredPayload.isNotBlank() }.forEach { echo += it.ignoredPayload }
        return if (expired.isEmpty()) state else state.copy(opportunities = state.opportunities - expired.toSet())
    }
'''
          new = '''    private fun expireOpportunities(c: Campaign, state: DeepLifeState, echo: MutableList<String>): DeepLifeState {
        val expired = state.opportunities.filter { c.turn > it.expiresTurn }
        if (expired.isEmpty()) return state
        var next = state.copy(opportunities = state.opportunities - expired.toSet())
        expired.forEach { opportunity ->
            if (opportunity.ignoredPayload.isNotBlank()) echo += opportunity.ignoredPayload
            when (opportunity.category) {
                "RELATION" -> {
                    val target = opportunity.personId
                    next = next.copy(
                        relationships = next.relationships.map { person ->
                            if (target != null && person.id == target) person.copy(
                                trust = (person.trust - 5).coerceAtLeast(0),
                                affection = (person.affection - 3).coerceAtLeast(0),
                                grudge = (person.grudge + 4).coerceAtMost(100)
                            ) else person
                        },
                        drama = next.drama.copy(
                            relationshipPressure = (next.drama.relationshipPressure + 6).coerceAtMost(100),
                            personalPressure = (next.drama.personalPressure + 4).coerceAtMost(100)
                        )
                    )
                }
                "RECOVERY" -> next = next.copy(
                    powerEvolution = next.powerEvolution?.let { it.copy(strain = (it.strain + 10).coerceAtMost(100)) },
                    drama = next.drama.copy(recoveryNeed = (next.drama.recoveryNeed + 12).coerceAtMost(100))
                )
                "INVESTIGATION" -> next = next.copy(
                    identityEvidence = next.identityEvidence.map { evidence ->
                        if (evidence.holderId == opportunity.personId || opportunity.personId == null)
                            evidence.copy(strength = (evidence.strength + 8).coerceAtMost(100))
                        else evidence
                    }
                )
                "INTERVENTION" -> next = next.copy(
                    perception = next.perception.copy(
                        district = (next.perception.district - 4).coerceIn(-100, 100),
                        city = (next.perception.city - 2).coerceIn(-100, 100)
                    ),
                    drama = next.drama.copy(worldPressure = (next.drama.worldPressure + 5).coerceAtMost(100))
                )
            }
        }
        return next
    }
'''
          assert old in text, 'expireOpportunities pattern missing'
          runtime.write_text(text.replace(old, new, 1))

          # Player-facing city screen should describe state, not expose debug-like raw metrics.
          world = Path('app/src/main/java/com/metahumanlegacy/game/GameplayRebuildWorldScreens.kt')
          text = world.read_text()
          text = text.replace('Text("État général ${state.cityCondition}% · ${state.metaLaw}", color = UltimateMuted, fontSize = 10.sp)',
                              'Text("${cityConditionLabel(state.cityCondition)} · ${state.metaLaw}", color = UltimateMuted, fontSize = 10.sp)')
          text = text.replace('Text("Crime ${d.crime} · dégâts ${d.damage} · reconstruction ${d.reconstruction}", color = UltimateMuted, fontSize = 10.sp)',
                              'Text(districtConditionLine(d), color = UltimateMuted, fontSize = 10.sp)')
          text = text.replace('Text("${opportunity.category} · expire dans ${(opportunity.expiresTurn - c.turn).coerceAtLeast(0)} étape(s)", color = UltimateMuted, fontSize = 10.sp)',
                              'Text(opportunityTimingLine(c, opportunity), color = UltimateMuted, fontSize = 10.sp)')
          text = text.replace('Text("Expire dans ${(o.expiresTurn - c.turn).coerceAtLeast(0)} étape(s)", color = UltimateMuted, fontSize = 10.sp)',
                              'Text(opportunityTimingLine(c, o), color = UltimateMuted, fontSize = 10.sp)')
          marker = 'private fun signedHuman(value: Int): String = when {'
          assert marker in text, 'world helper insertion marker missing'
          helpers = '''private fun cityConditionLabel(value: Int): String = when {
    value >= 80 -> "Ville stable"
    value >= 60 -> "Ville sous pression mais fonctionnelle"
    value >= 40 -> "Ville fragilisée"
    value >= 20 -> "Ville en crise"
    else -> "Ville au bord de l'effondrement"
}

private fun districtConditionLine(d: UltimateDistrict): String {
    val danger = (d.crime + d.damage - d.reconstruction / 2).coerceIn(0, 100)
    val safety = when {
        danger >= 75 -> "violence très présente"
        danger >= 50 -> "tensions régulières"
        danger >= 30 -> "incidents contenus"
        else -> "rues plutôt calmes"
    }
    val fabric = when {
        d.damage >= 65 -> "quartier lourdement marqué"
        d.damage >= 35 -> "traces visibles des crises"
        d.reconstruction >= 45 -> "reconstruction bien engagée"
        else -> "bâti encore stable"
    }
    return "$safety · $fabric"
}

private fun opportunityTimingLine(c: Campaign, opportunity: Opportunity): String {
    val remaining = (opportunity.expiresTurn - c.turn).coerceAtLeast(0)
    val kind = when (opportunity.category) {
        "RELATION" -> "Quelqu'un t'attend"
        "RECOVERY" -> "Ton corps réclame du temps"
        "INVESTIGATION" -> "Une piste reste ouverte"
        "INTERVENTION" -> "Le quartier attend une réponse"
        else -> "Occasion fragile"
    }
    val timing = when (remaining) {
        0 -> "dernière chance"
        1 -> "très urgent"
        2 -> "bientôt trop tard"
        else -> "encore un peu de temps"
    }
    return "$kind · $timing"
}

'''
          world.write_text(text.replace(marker, helpers + marker, 1))

          # Never fall back to the pre-rebuild career shell for an unknown route.
          app = Path('app/src/main/java/com/metahumanlegacy/game/GameplayRebuildApp.kt')
          text = app.read_text()
          pattern = re.compile(r'''\n\s{32}else -> UltimateCareerShell\(.*?\n\s{32}\)\n\s{28}\}''', re.S)
          match = pattern.search(text)
          assert match, 'legacy UltimateCareerShell fallback pattern missing'
          replacement = '''
                                else -> GameplayRebuildEarlyShell(
                                    c = c,
                                    state = u,
                                    annual = a,
                                    deep = dl,
                                    outcome = outcome,
                                    savePulse = savePulse,
                                    onScreen = { go(it) },
                                    onContinue = {
                                        haptic(MetahumanMotionLevel.MOTION_SUBTLE)
                                        outcome = null
                                        saveRebuildOutcome(context, c.seed, null)
                                        if (campaign?.needsAlias == true) screen = "ALIAS"
                                    },
                                    onChoice = choiceHandler,
                                    onHome = { go("HOME") },
                                    onSettings = { go("SETTINGS") }
                                )
                            }'''
          text = text[:match.start()] + replacement + text[match.end():]
          app.write_text(text)
          PY
      - name: Commit fixes
        run: |
          git config user.name "metahuman-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/metahumanlegacy/game/DeepLifeRuntime.kt app/src/main/java/com/metahumanlegacy/game/GameplayRebuildWorldScreens.kt app/src/main/java/com/metahumanlegacy/game/GameplayRebuildApp.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(audit): make missed time costly and remove legacy UI fallback [audit-autofix-2]"
          git push origin HEAD:audit/game-defects-2-6
