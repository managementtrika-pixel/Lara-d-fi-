name: Zeubi Brawl APK

on:
  push:
    branches: [ feature/beat-em-up-finished ]
    paths:
      - 'native/**'
      - 'BEATEMUP.md'
      - '.github/workflows/beat-em-up-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zeubi-brawl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - uses: android-actions/setup-android@v3

      - name: Installer Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          chmod +x native/gradlew

      - name: Tests unitaires
        working-directory: native
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Lint Android
        working-directory: native
        run: ./gradlew lint --no-daemon --stacktrace

      - name: Compiler l'APK
        working-directory: native
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Préparer Zeubi Brawl
        run: |
          mkdir -p downloads
          cp native/app/build/outputs/apk/debug/app-debug.apk downloads/ZeubiBrawl.apk
          ${ANDROID_HOME}/build-tools/36.0.0/apksigner verify --verbose downloads/ZeubiBrawl.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZeubiBrawl-APK
          path: downloads/ZeubiBrawl.apk
          retention-days: 30

      - name: Publier l'APK sur la branche
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/ZeubiBrawl.apk
          if git diff --cached --quiet; then
            echo "APK déjà à jour."
            exit 0
          fi
          git commit -m "Publier Zeubi Brawl APK [skip ci]"
          git push origin HEAD:feature/beat-em-up-finished
