name: Illustrated Face Mode Autopatch

on:
  push:
    branches:
      - fix/true-modular-character-assets

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/true-modular-character-assets
      - name: Apply safe illustrated face mode
        run: python3 .github/scripts/patch_character_mode.py
      - name: Remove one-shot patch files
        run: rm .github/scripts/patch_character_mode.py .github/workflows/character-asset-mode-autopatch.yml
      - name: Commit safe illustrated face mode
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make Library face selection atomic and persistent"
          git push origin HEAD:fix/true-modular-character-assets
