name: Library Customization Autopatch

on:
  push:
    branches:
      - feat/library-customization-assets

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[library-autopatch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/library-customization-assets
          fetch-depth: 0
      - name: Wire validated Library presets into customization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/metahumanlegacy/game/UltimateScreens.kt')
          text = path.read_text()

          def once(old, new, label):
              global text
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'Expected insertion point missing: {label}')
              text = text.replace(old, new, 1)

          old = '''                        OptionStrip("SILHOUETTE", UltimateCatalog.bodyBuilds, draft.bodyBuild) { onDraft(draft.copy(bodyBuild = it)) }'''
          new = '''                        LibraryFacePresetStrip(draft, onDraft)\n                        OptionStrip("SILHOUETTE", UltimateCatalog.bodyBuilds, draft.bodyBuild) { onDraft(draft.copy(bodyBuild = it)) }'''
          once(old, new, 'face presets')

          old = '''                        UltimateCityArtwork(previewCampaign, previewState, Modifier.fillMaxWidth().height(210.dp).clip(CutCornerShape(18.dp)))\n                        OptionStrip("VILLE", GameEngine.cities, draft.blueprint.city) { updateBlueprint(draft.blueprint.copy(city = it)) }'''
          new = '''                        UltimateCityArtwork(previewCampaign, previewState, Modifier.fillMaxWidth().height(210.dp).clip(CutCornerShape(18.dp)))\n                        LibraryCityPresetStrip(draft, onDraft)\n                        OptionStrip("VILLE", GameEngine.cities, draft.blueprint.city) { updateBlueprint(draft.blueprint.copy(city = it)) }'''
          once(old, new, 'city presets')

          old = '''            OptionStrip("MASQUE", UltimateCatalog.maskStyles, mask) { mask = it }\n            Spacer(Modifier.height(12.dp))\n            MhlPrimaryButton("Prendre cette identité", { onConfirm(alias.trim(), presentation, palette, mask) }, Modifier.fillMaxWidth(), alias.trim().isNotBlank())'''
          new = '''            OptionStrip("MASQUE", UltimateCatalog.maskStyles, mask) { mask = it }\n            LibraryAliasCostumePresetStrip(presentation, palette, mask) { preset ->\n                presentation = preset.presentation\n                palette = preset.palette\n                mask = preset.mask\n            }\n            Spacer(Modifier.height(12.dp))\n            MhlPrimaryButton("Prendre cette identité", { onConfirm(alias.trim(), presentation, palette, mask) }, Modifier.fillMaxWidth(), alias.trim().isNotBlank())'''
          once(old, new, 'alias costume presets')

          old = '''            Spacer(Modifier.height(6.dp))\n            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(5.dp)) {\n                Box(Modifier.weight(1f)) { UltimateActionTile("Présence", state.heroPresentation, profile.accent, onClick = { onStateChange(state.copy(heroPresentation = cycle(UltimateCatalog.heroPresentations, state.heroPresentation))) }) }'''
          new = '''            Spacer(Modifier.height(6.dp))\n            LibraryCostumePresetStrip(state, state.costumeEra.coerceAtLeast(1), onStateChange)\n            Spacer(Modifier.height(8.dp))\n            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(5.dp)) {\n                Box(Modifier.weight(1f)) { UltimateActionTile("Présence", state.heroPresentation, profile.accent, onClick = { onStateChange(state.copy(heroPresentation = cycle(UltimateCatalog.heroPresentations, state.heroPresentation))) }) }'''
          once(old, new, 'career costume presets')

          path.write_text(text)
          PY
      - name: Commit UI wiring
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/metahumanlegacy/game/UltimateScreens.kt
          git commit -m "[library-autopatch] Wire validated Library presets into customization"
          git push origin HEAD:feat/library-customization-assets
