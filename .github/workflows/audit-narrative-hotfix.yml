name: Audit narrative hotfix
on:
  push:
    branches: [ "audit/game-defects-2-6" ]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[narrative-hotfix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/game-defects-2-6
      - name: Repair exhausted narrative fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/metahumanlegacy/game/NarrativeRepository.kt')
          s = p.read_text()
          old = '''        val fallback = arcStart.values.filter { canStartIgnoringCompletion(c, it) }
            .maxByOrNull { beatScore(c, it, active) }
            ?: arcStart.values.first()
        return majorNode(c, fallback)
    }

    private fun canStart(c: Campaign, b: MajorBeat): Boolean =
'''
          new = '''        // Never resurrect a completed or age-expired authored arc just to avoid an empty turn.
        // Once the authored graph has no causal candidate, life itself becomes the event.
        return lifeInterlude(c)
    }

    private fun lifeInterlude(c: Campaign): EventNode {
        val variants = listOf(
            Triple("UNE SEMAINE SANS CATASTROPHE", "Pour une fois, aucune alerte mondiale ne décide de ton agenda. Le vide te force à regarder ce que ta vie est devenue quand personne ne réclame ton pouvoir.", "VIE"),
            Triple("CEUX QUI ONT CONTINUÉ SANS TOI", "Des gens que tu as connus ont avancé, vieilli, déménagé, fondé quelque chose ou cessé de t'attendre. Tu disposes d'un peu de temps avant que le monde recommence à crier.", "RELATION"),
            Triple("LE QUARTIER UN MATIN ORDINAIRE", "Tu traverses un endroit que tes anciennes interventions ont changé. Certains dégâts ont disparu, certaines habitudes sont restées, et personne ne sait que tu observes.", "CIVIL"),
            Triple("TON CORPS AVANT LE COSTUME", "Avant de repartir, un geste banal te rappelle les années accumulées. L'expérience t'a appris à compenser beaucoup de choses, pas à les effacer.", "SANTÉ"),
            Triple("UNE DEMANDE QUI N'A RIEN D'HÉROÏQUE", "Quelqu'un te demande du temps, pas une intervention. Dire oui ne sauvera pas la ville. Dire non ne fera pas la une. C'est précisément pour ça que la décision compte.", "RELATION"),
            Triple("CE QUE TON NOM EST DEVENU", "Ton alias circule désormais dans des conversations auxquelles tu n'assistes pas. Certains y voient une protection, d'autres une menace, d'autres encore une époque qui commence à passer.", "MÉDIAS"),
            Triple("APRÈS LA VICTOIRE", "Une crise ancienne est terminée depuis longtemps. Ce qui reste maintenant, ce sont les conséquences lentes : réparations, rancunes, habitudes, dettes et gens qui ont appris à vivre autrement.", "HÉRITAGE"),
            Triple("QUI RÉPONDRA APRÈS TOI ?", "Plus les années passent, moins la vraie question est de savoir si tu peux encore intervenir. Elle devient : qui saura agir quand tu décideras enfin de ne pas le faire ?", "HÉRITAGE")
        )
        val index = positiveMod(mix(c.seed, c.turn * 1777L + c.age), variants.size)
        val (title, text, category) = variants[index]
        val stakes = if (c.age >= 60) 2 else 1
        val choices = listOf(
            Choice("Donner ce temps à quelqu'un qui compte", moral = 1, relationDelta = 2, approach = "CARE", stakes = stakes, sourceCategory = category, deferredHook = true),
            Choice("Mettre de l'ordre dans ce qui dépend encore de toi", control = 0, prestige = 1, approach = "ORDER", stakes = stakes, sourceCategory = category),
            Choice("Regarder ce qui a réellement changé et pourquoi", opinion = 1, approach = "TRUTH", stakes = stakes, sourceCategory = category, deferredHook = true),
            Choice("Préparer la prochaine étape de ton propre héritage", prestige = 1, impact = 1, risk = if (c.age >= 65) 2 else 1, approach = "ASCEND", stakes = stakes, sourceCategory = category)
        )
        return EventNode(
            id = "LIFE_INTERLUDE_${index}_${c.turn}",
            title = title,
            text = contextualize(text, c),
            choices = choices,
            category = category,
            provocation = "VIE QUI CONTINUE",
            stakes = stakes,
            threadId = null,
            threadStage = 0,
            kind = "QUIET"
        )
    }

    private fun canStart(c: Campaign, b: MajorBeat): Boolean =
'''
          assert old in s, 'fallback block not found'
          s = s.replace(old, new, 1)
          # Delete obsolete helper that intentionally ignored max age/completion.
          old_helper = '''    private fun canStartIgnoringCompletion(c: Campaign, b: MajorBeat): Boolean =
        c.powerRevealed && c.age >= b.minAge && b.requiresFlags.all { it in c.flags }

'''
          assert old_helper in s
          s = s.replace(old_helper, '', 1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "metahuman-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/metahumanlegacy/game/NarrativeRepository.kt
          git commit -m "fix(audit): stop resurrecting completed arcs in late life [narrative-hotfix]"
          git push origin HEAD:audit/game-defects-2-6
