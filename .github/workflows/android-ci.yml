name: Android CI

on:
  push:
    branches: [ "main", "final/comic-apk", "final/metahuman-legacy-5.0" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Lint
        run: gradle --no-daemon lintDebug
      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug
      - name: Assemble final release APK
        run: gradle --no-daemon assembleRelease
      - name: Verify APK signature and alignment
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: metahuman-legacy-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
      - name: Record release source
        run: |
          git rev-parse HEAD > final-source-commit.txt
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk > final-unsigned-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: metahuman-legacy-final-release
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            final-source-commit.txt
            final-unsigned-sha256.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metahuman-legacy-unit-and-lint-reports
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
      - name: Export Android packaging tools
        run: |
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" zipalign
          chmod +x zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: android-packaging-tools
          path: |
            apksigner.jar
            zipalign
          if-no-files-found: error

  instrumentation-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch smoke test on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest
      - name: Collect device previews
        if: always()
        run: |
          mkdir -p final-preview
          adb pull /sdcard/Android/data/com.metahumanlegacy.game/files/final-preview/. final-preview/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metahuman-legacy-device-reports
          path: |
            final-preview
            app/build/outputs/androidTest-results/connected
            app/build/reports/androidTests/connected
          if-no-files-found: warn
