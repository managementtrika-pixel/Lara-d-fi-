name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Lint
        run: gradle --no-daemon lintDebug
      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug
      - name: SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: metahuman-legacy-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
      - name: Export official apksigner
        run: cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: apksigner.jar
          if-no-files-found: error
