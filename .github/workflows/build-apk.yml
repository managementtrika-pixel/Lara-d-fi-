name: Construire APK ZeubiCardGames

on:
  push:
    branches: [ main ]
    paths:
      - 'ZeubiCardGames_Android_Project.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier le projet
        run: |
          test -f ZeubiCardGames_Android_Project.zip || {
            echo "Le fichier ZeubiCardGames_Android_Project.zip est absent."
            exit 1
          }

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extraire le projet
        run: |
          rm -rf workspace
          mkdir workspace
          unzip -q ZeubiCardGames_Android_Project.zip -d workspace
          PROJECT_DIR="$(dirname "$(find workspace -maxdepth 3 -name settings.gradle -print -quit)")"
          test -n "$PROJECT_DIR" && test -f "$PROJECT_DIR/settings.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compiler l’APK
        run: gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Préparer l’APK
        run: |
          APK_SOURCE="$(find "$PROJECT_DIR" -path '*/build/outputs/apk/debug/*-debug.apk' -print -quit)"
          test -n "$APK_SOURCE" && test -f "$APK_SOURCE"
          mkdir -p apk downloads
          cp "$APK_SOURCE" apk/ZeubiCardGames.apk
          cp "$APK_SOURCE" downloads/ZeubiCardGames.apk

      - name: Publier l’APK dans les Actions
        uses: actions/upload-artifact@v4
        with:
          name: ZeubiCardGames-APK
          path: apk/ZeubiCardGames.apk
          retention-days: 30

      - name: Ajouter le lien de téléchargement au dépôt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/ZeubiCardGames.apk
          if git diff --cached --quiet; then
            echo "APK déjà à jour."
          else
            git commit -m "Publier ZeubiCardGames.apk [skip ci]"
            git push
          fi
