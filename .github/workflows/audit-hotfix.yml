name: Audit logic hotfix
on:
  push:
    branches: [ "audit/game-defects-2-6" ]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[logic-hotfix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/game-defects-2-6
      - name: Fix power-use precedence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/metahumanlegacy/game/DeepLifeRuntime.kt')
          s = p.read_text()
          old = 'val use = (choice.power + if (choice.approach == "ASCEND") 2 else 0 + if (event.category.contains("POUVOIR", true)) 2 else 0).coerceAtLeast(0)'
          new = 'val use = (choice.power + (if (choice.approach == "ASCEND") 2 else 0) + (if (event.category.contains("POUVOIR", true)) 2 else 0)).coerceAtLeast(0)'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name "metahuman-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/metahumanlegacy/game/DeepLifeRuntime.kt
          git commit -m "fix(audit): correct power use accumulation precedence [logic-hotfix]"
          git push origin HEAD:audit/game-defects-2-6
