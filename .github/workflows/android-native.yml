name: Android natif ZeubiCardGames

on:
  push:
    branches: [ main ]
    paths:
      - 'ZeubiCardGames_Native_Source.zip'
      - 'ZeubiCardGames_V8_5_CombatModes_BoosterDisplay.html'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Déployer et corriger la source native
        run: |
          test -f ZeubiCardGames_Native_Source.zip || {
            echo 'Ajoute ZeubiCardGames_Native_Source.zip à la racine du dépôt.'
            exit 1
          }
          rm -rf native
          unzip -q ZeubiCardGames_Native_Source.zip -d .
          chmod +x native/gradlew native/tools/build_catalog.mjs

          # API 36 est la plateforme Android stable disponible sur le runner.
          sed -i 's/compileSdk = 37/compileSdk = 36/' native/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' native/app/build.gradle.kts

          # AGP 9 intègre Kotlin nativement : l’ancien plugin Android Kotlin ferait doublon.
          sed -i '/alias(libs.plugins.kotlin.android)/d' native/app/build.gradle.kts

          echo '--- Configuration Android ---'
          grep -E 'compileSdk|targetSdk|minSdk' native/app/build.gradle.kts
          echo '--- Plugins application ---'
          sed -n '1,12p' native/app/build.gradle.kts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Auditer et extraire les assets V8.5
        run: node native/tools/build_catalog.mjs --html ZeubiCardGames_V8_5_CombatModes_BoosterDisplay.html --project native

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - uses: android-actions/setup-android@v3

      - name: Installer SDK Android 36 stable
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Lint
        working-directory: native
        run: ./gradlew lint --no-daemon --stacktrace

      - name: Tests unitaires
        working-directory: native
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Compiler APK debug
        working-directory: native
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Préparer l’APK
        run: |
          mkdir -p downloads
          cp native/app/build/outputs/apk/debug/app-debug.apk downloads/ZeubiCardGames-Native-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZeubiCardGames-debug-apk
          path: downloads/ZeubiCardGames-Native-debug.apk
          retention-days: 30

      - name: Publier la source auditée et l’APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native downloads/ZeubiCardGames-Native-debug.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Construire la base Android native ZeubiCardGames [skip ci]"
          git push
