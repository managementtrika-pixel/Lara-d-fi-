name: Android natif ZeubiCardGames

on:
  push:
    branches: [ main ]
    paths:
      - 'native/**'
      - 'ZeubiCardGames_V8_5_CombatModes_BoosterDisplay.html'
      - '.github/workflows/android-native.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la source native
        run: |
          test -f native/gradlew || {
            echo 'Le projet Android natif versionné est introuvable.'
            exit 1
          }
          test -f native/tools/build_catalog.mjs || {
            echo 'Le générateur de catalogue est introuvable.'
            exit 1
          }
          test -f native/tools/normalize_catalog.mjs || {
            echo 'Le normaliseur de catalogue V1 est introuvable.'
            exit 1
          }
          chmod +x native/gradlew native/tools/build_catalog.mjs native/tools/normalize_catalog.mjs
          grep -E 'compileSdk|targetSdk|minSdk' native/app/build.gradle.kts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Auditer et synchroniser le catalogue V8.5
        run: node native/tools/build_catalog.mjs --html ZeubiCardGames_V8_5_CombatModes_BoosterDisplay.html --project native

      - name: Normaliser le catalogue ZeubiCardGames V1
        run: node native/tools/normalize_catalog.mjs --project native

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - uses: android-actions/setup-android@v3

      - name: Installer SDK Android 36 stable
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Lint
        working-directory: native
        run: ./gradlew lint --no-daemon --stacktrace

      - name: Tests unitaires
        working-directory: native
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Compiler APK debug
        working-directory: native
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Préparer l’APK
        run: |
          mkdir -p downloads
          cp native/app/build/outputs/apk/debug/app-debug.apk downloads/ZeubiCardGames-Native-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZeubiCardGames-debug-apk
          path: downloads/ZeubiCardGames-Native-debug.apk
          retention-days: 30

      - name: Publier uniquement les artefacts utiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Nettoyage de l’ancien dépôt qui avait accidentellement versionné caches et sorties Gradle.
          git rm -r --cached --ignore-unmatch native/.gradle native/app/build || true

          git add .gitignore
          git add native/app/src/main/assets
          git add native/app/schemas 2>/dev/null || true
          git add downloads/ZeubiCardGames-Native-debug.apk

          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publier le build Android natif validé [skip ci]"
          git push
