name: Android natif ZeubiCardGames
# Relance CI manuelle — 2026-08-09 23:00 Europe/Paris

on:
  push:
    branches: [ main ]
    paths:
      - 'native/**'
      - 'ZeubiCardGames_V8_5_CombatModes_BoosterDisplay.html'
      - '.github/workflows/android-native.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier la source native
        run: |
          test -f native/gradlew || {
            echo 'Le projet Android natif versionné est introuvable.'
            exit 1
          }
          test -f native/tools/build_catalog.mjs || {
            echo 'Le générateur de catalogue est introuvable.'
            exit 1
          }
          test -f native/tools/normalize_catalog.mjs || {
            echo 'Le normaliseur de catalogue V1 est introuvable.'
            exit 1
          }
          test -f native/tools/audit_effect_coverage.mjs || {
            echo 'L’audit de couverture des effets est introuvable.'
            exit 1
          }
          chmod +x native/gradlew native/tools/build_catalog.mjs native/tools/normalize_catalog.mjs native/tools/audit_effect_coverage.mjs
          grep -E 'compileSdk|targetSdk|minSdk|versionCode|versionName' native/app/build.gradle.kts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Auditer et synchroniser le catalogue V8.5
        run: node native/tools/build_catalog.mjs --html ZeubiCardGames_V8_5_CombatModes_BoosterDisplay.html --project native

      - name: Normaliser le catalogue ZeubiCardGames V1
        run: node native/tools/normalize_catalog.mjs --project native

      - name: Auditer la couverture Actions / Répliques
        run: node native/tools/audit_effect_coverage.mjs --project native

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restaurer la signature Android stable
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: zeubicardgames-debug-keystore-v1

      - name: Préparer la signature Android stable
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=ZeubiCardGames,C=FR" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - uses: android-actions/setup-android@v3

      - name: Installer SDK Android 36 stable
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Lint
        working-directory: native
        run: ./gradlew lint --no-daemon --stacktrace

      - name: Tests unitaires
        working-directory: native
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Compiler APK debug
        working-directory: native
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Vérifier la signature de l’APK
        run: |
          ${ANDROID_HOME}/build-tools/36.0.0/apksigner verify --verbose --print-certs native/app/build/outputs/apk/debug/app-debug.apk

      - name: Préparer l’APK
        run: |
          mkdir -p downloads
          cp native/app/build/outputs/apk/debug/app-debug.apk downloads/ZeubiCardGames-Native-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZeubiCardGames-debug-apk
          path: downloads/ZeubiCardGames-Native-debug.apk
          retention-days: 30

      - name: Publier uniquement les artefacts utiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -r --cached --ignore-unmatch native/.gradle native/app/build || true

          git add .gitignore
          git add native/app/src/main/assets
          git add native/app/schemas 2>/dev/null || true
          git add downloads/ZeubiCardGames-Native-debug.apk

          if git diff --cached --quiet; then
            echo 'Aucun artefact à publier.'
            exit 0
          fi

          git commit -m "Publier le build Android natif validé [skip ci]"

          # Une seule exécution est autorisée par la section concurrency ci-dessus.
          # Ce rebase protège aussi contre un commit manuel arrivé pendant le build.
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo 'Le dépôt a avancé avec des changements incompatibles pendant ce build. Une exécution plus récente publiera les artefacts.'
            exit 0
          fi

          git push origin HEAD:main
